<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>거래처·회계 관리</title>

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Splash screen (인라인: JS 로드 전에 렌더링) -->
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      transition: opacity .3s;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-logo { font-size: 48px; }
    .splash-title { font-size: 18px; font-weight: 700; color: #b45309; }
    .splash-sub   { font-size: 12px; color: #94a3b8; }
    .splash-bar   {
      width: 120px; height: 3px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; margin-top: 8px;
    }
    .splash-bar-fill {
      height: 100%; background: linear-gradient(90deg, #d97706, #fbbf24);
      border-radius: 9999px;
      animation: splashload 1.2s ease-in-out infinite;
    }
    @keyframes splashload {
      0%   { width: 0%; margin-left: 0; }
      50%  { width: 80%; margin-left: 10%; }
      100% { width: 0%; margin-left: 100%; }
    }
    /* 스피너 (syncModal 등에서 사용) */
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Splash ───────────────────────────────────────────────────────────────── -->
<div id="splash">
  <div class="splash-logo">📊</div>
  <div class="splash-title">거래처·회계 관리</div>
  <div class="splash-sub">데이터를 불러오는 중…</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
</div>

<!-- ── App Root ──────────────────────────────────────────────────────────────── -->
<div id="app"></div>
<div id="modal-root"></div>

<!-- ── Splash Helper ─────────────────────────────────────────────────────────── -->
<script>
function hideSplash() {
  const el = document.getElementById('splash');
  if (!el) return;
  el.classList.add('hidden');
  setTimeout(() => el.remove(), 350);
}
</script>

<!-- ── JS 모듈 (의존 순서대로 로드) ──────────────────────────────────────────── -->
<!-- 1. 상수·아이콘 -->
<script src="js/config.js"></script>
<script src="js/icons.js"></script>

<!-- 2. 유틸리티 (fmt, date, search, toast, statusBadge) -->
<script src="js/utils.js"></script>

<!-- 3. 전역 상태·Firebase·CRUD·Persistence -->
<script src="js/state.js"></script>

<!-- 4. 납품 관리 연동 -->
<script src="js/napum.js"></script>

<!-- 5. 뷰 빌더 (대시보드·거래처·거래·채권채무) -->
<script src="js/views.js"></script>

<!-- 6. 백업·초기화 모달 -->
<script src="js/backup.js"></script>

<!-- 7. 앱 진입점 (render·모달·핸들러·스와이프·INIT) -->
<script src="js/app.js"></script>

</body>
</html>
